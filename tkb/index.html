<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>合同会社TKB - ラフ案</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #1f2933;
      background: #f7f5ef;
      line-height: 1.8;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .page {
      width: min(100%, 960px);
      background: #ffffff;
      border: 1px solid #e4dfd2;
      border-radius: 8px;
      padding: clamp(28px, 5vw, 56px);
      box-shadow: 0 12px 32px rgba(31, 41, 51, 0.08);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #6b7c3f;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.25;
      letter-spacing: 0;
    }

    .lead {
      max-width: 680px;
      margin: 24px 0 0;
      color: #52616b;
      font-size: clamp(16px, 2.4vw, 19px);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 32px;
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 6px 12px;
      border: 1px solid #d9d1bd;
      border-radius: 6px;
      color: #3d4d2f;
      background: #fbfaf6;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <section class="page" aria-labelledby="page-title">
      <p class="eyebrow">ROUGH PROPOSAL</p>
      <h1 id="page-title">合同会社TKB<br>Webサイト ラフ案</h1>
      <p class="lead">
        営業提案用の仮ページです。正式なコピー、写真、事業内容、所在地、料金、実績などは確認後に差し替えます。
      </p>
      <div class="meta" aria-label="ページ情報">
        <span>GitHub Pages 共有用</span>
        <span>初期配置</span>
        <span>要内容確認</span>
      </div>
    </section>
  </main>
</body>
</html>
