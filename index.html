<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>営業ラフ案デモ一覧</title>
  <style>
    :root {
      --ink: #17201c;
      --muted: #65706b;
      --paper: #faf8f2;
      --line: rgba(23,32,28,.13);
      --leaf: #2f6b4f;
      --wood: #9b5f32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
      line-height: 1.7;
      letter-spacing: 0;
    }
    main {
      width: min(1040px, calc(100% - 36px));
      margin: 0 auto;
      padding: 72px 0;
    }
    header {
      display: grid;
      gap: 14px;
      margin-bottom: 34px;
    }
    p { margin: 0; color: var(--muted); }
    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.12;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      letter-spacing: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    a.card {
      min-height: 190px;
      display: grid;
      align-content: space-between;
      gap: 22px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    a.card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 42px rgba(23,32,28,.12);
    }
    .label {
      width: fit-content;
      padding: 5px 9px;
      border-radius: 999px;
      color: #fff;
      background: var(--leaf);
      font-size: 11px;
      font-weight: 800;
    }
    .card:nth-child(even) .label { background: var(--wood); }
    h2 { margin: 0; font-size: 21px; line-height: 1.35; }
    .path { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    footer { margin-top: 34px; color: var(--muted); font-size: 12px; }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      main { padding: 46px 0; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>営業ラフ案デモ一覧</h1>
      <p>GitHub Pagesで共有する営業提案用の静的デモです。</p>
    </header>
    <div class="grid">
      <a class="card" href="henmi-building/">
        <span class="label">New</span>
        <h2>ヘンミ建物株式会社</h2>
        <span class="path">/demo-hp/henmi-building/</span>
      </a>
      <a class="card" href="abel-home/">
        <span class="label">Demo</span>
        <h2>アベルホーム</h2>
        <span class="path">/demo-hp/abel-home/</span>
      </a>
      <a class="card" href="matsuoka/">
        <span class="label">Demo</span>
        <h2>松岡工務店</h2>
        <span class="path">/demo-hp/matsuoka/</span>
      </a>
      <a class="card" href="tkb/">
        <span class="label">Demo</span>
        <h2>合同会社TKB</h2>
        <span class="path">/demo-hp/tkb/</span>
      </a>
      <a class="card" href="dremi/">
        <span class="label">Demo</span>
        <h2>どれみ自然整体院</h2>
        <span class="path">/demo-hp/dremi/</span>
      </a>
    </div>
    <footer>Published from riku103/demo-hp GitHub Pages.</footer>
  </main>
</body>
</html>
